{% extends "base.html" %}
{% block title %}Öğretici{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold text-slate-800 mb-6">{% if object %}Öğretici Düzenle{% else %}Yeni Öğretici{% endif %}</h1>
<div class="bg-white rounded-xl shadow p-6 max-w-lg">
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {% for field in form %}
      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<p class="text-red-600 text-xs mt-1">{{ field.errors|striptags }}</p>{% endif %}
      </div>
    {% endfor %}
    <button type="submit" class="bg-brand-700 hover:bg-brand-800 text-white font-medium px-5 py-2.5 rounded-lg">Kaydet</button>
  </form>
</div>
{% endblock %}
