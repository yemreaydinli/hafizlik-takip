{% extends "base.html" %}
{% block title %}Raporlar · Hafızlık Takip{% endblock %}
{% block content %}
<div class="page-head">
  <div><h1 class="h1">Raporlar</h1><p class="sub">Raporu seçin, PDF veya Excel olarak indirin.</p></div>
</div>
<form method="get" action="{% url 'reports:generate' %}" class="card card-medium stack">
  <div class="field">
    <label class="label" for="type">Rapor türü</label>
    <select name="type" id="type" class="input">
      <option value="daily">Günlük rapor</option>
      <option value="weekly">Haftalık rapor</option>
      <option value="monthly">Aylık rapor</option>
      <option value="attendance">Devamsızlık raporu</option>
      <option value="progress">Hafızlık ilerleme raporu</option>
      <option value="prediction">Tahmini bitiş raporu</option>
    </select>
  </div>
  <div class="field-grid two">
    <div class="field">
      <label class="label" for="start">Başlangıç tarihi</label>
      <input type="date" name="start" id="start" class="input">
    </div>
    <div class="field">
      <label class="label" for="end">Bitiş tarihi</label>
      <input type="date" name="end" id="end" class="input">
    </div>
  </div>
  <p class="help">Tarih aralığı yalnızca günlük, haftalık ve aylık raporlarda kullanılır. Diğer raporlar güncel duruma göre hazırlanır.</p>
  <div class="actions actions-stack">
    <button type="submit" name="format" value="excel" class="btn btn-secondary"><svg class="ic ic-sm"><use href="#i-sheet"/></svg>Excel indir</button>
    <button type="submit" name="format" value="pdf" class="btn btn-primary"><svg class="ic ic-sm"><use href="#i-file"/></svg>PDF indir</button>
  </div>
</form>
{% endblock %}
