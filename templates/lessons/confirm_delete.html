{% extends "base.html" %}
{% block content %}
<div class="bg-white rounded-xl shadow p-6 max-w-md">
  <p class="mb-4">{{ lesson.student.full_name }} - {{ lesson.date|date:"d.m.Y" }} tarihli ders kaydını silmek istediğinize emin misiniz?</p>
  <form method="post" class="flex gap-3">
    {% csrf_token %}
    <button class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg">Evet, Sil</button>
    <a href="{% url 'students:detail' lesson.student.pk %}" class="px-4 py-2 rounded-lg border border-slate-300">Vazgeç</a>
  </form>
</div>
{% endblock %}
