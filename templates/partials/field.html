<div class="field">
  <label class="label"{% if field.id_for_label %} for="{{ field.id_for_label }}"{% endif %}>{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<p class="help">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}<p class="err">{{ field.errors|striptags }}</p>{% endif %}
</div>
